[project]
name = "hotkernels"
# The version is written once, in meson.build, and meson-python reads it from there.
dynamic = ["version"]
description = "Faster kernels for NumPy operations, installed with one line."
license = "MIT"
# The page on PyPI. The repository's own README is for people working on it.
readme = "README.md"
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://sofeikov.github.io/hotkernels/"
Repository = "https://github.com/sofeikov/hotkernels"
"Release notes" = "https://github.com/sofeikov/hotkernels/releases"

[build-system]
requires = ["meson-python>=0.17", "numpy>=2.0", "jinja2>=3.1.6", "typer>=0.29.1"]
build-backend = "mesonpy"

# The extension is compiled from the kernels in ../kernels, so a change there
# or in the binding's sources must rebuild the package.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "meson.build" },
    { file = "meson.options" },
    { file = "tools/**" },
    { file = "src/**" },
    { file = "../kernels/*/spec.py" },
    { file = "../kernels/*/naive.c" },
    { file = "../kernels/*/*/kernel.s" },
]

# Wheels, built by cibuildwheel in .github/workflows/release.yml from the source
# distribution, which carries its own kernel set.
[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# Free-threaded Python is not supported: install() does nothing there (issue 21).
skip = ["cp3??t-*"]
# A wheel runs on every Apple Silicon Mac, so C kernels are compiled for the
# first one, not for the machine that builds the wheel. See meson.options.
config-settings = { setup-args = "-Dkernel_cpu=apple-m1" }
# Run in a fresh environment with only the wheel and its dependencies: the
# extension loads, the self-test of every hook passes, and kernels are installed.
test-command = [
    "python -c \"import hotkernels; hotkernels.install(); r = hotkernels.report(); assert r.installed_count > 0 and not r.problems, r\"",
    "python -m hotkernels --help",
]

[tool.cibuildwheel.macos]
archs = ["arm64"]
# The oldest macOS the wheels claim to run on; Apple Silicon starts at 11.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
