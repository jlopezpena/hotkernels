<title id="t">Speedup of each hotkernels kernel over NumPy</title>
<desc id="d">Horizontal bars, one per NumPy call, showing how many times faster the kernel is than NumPy 2.5.5 on arrays of 1,048,576 elements on an Apple M1 Pro. The values are in the table that follows the chart in the README.</desc>
<text x="0" y="20" font-size="16" font-weight="600" fill="#f0efec">Speedup over NumPy</text>
