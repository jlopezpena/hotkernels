name: pages

# Builds the documentation site and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The site is built from Markdown and recorded results, and needs no kernel.
    # On Linux the package builds without its extension, and a runner is
    # assigned at once; hosted macOS runners can take a quarter of an hour.
    runs-on: ubuntu-latest
    steps:
      # The page "Over time" marks the merges between the commits it timed,
      # so it needs the full history of main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The workloads' recorded runs (docs/workloads-history-design.md). Until
      # the branch exists the page shows no runs, and the build goes on.
      - run: git fetch origin perf-history:refs/remotes/origin/perf-history || echo "::warning::no perf-history branch"
      - uses: astral-sh/setup-uv@v5
      - run: uv run docsite build --out build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
