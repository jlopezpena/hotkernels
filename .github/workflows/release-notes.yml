name: release-notes

# A pull request that changes what users of the package get leaves a release
# note in release-notes/upcoming/. The `no release note` label skips the check,
# for a change no user would notice. See "Release notes" in AGENTS.md.
on:
  pull_request:
    # Labelling reruns the check, so adding the label clears a failure.
    # `edited` covers a change of base branch, which changes the diff.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  note:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no release note') }}
    runs-on: macos-15 # Apple Silicon, where `uv run` builds the workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the check diffs the pull request against its base branch
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - env:
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: uv run release check-note --base "origin/$BASE" --pr "$PR"
