name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The maintainer's Mac when it is free, a hosted macOS runner otherwise.
  runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  judge:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }} # Apple Silicon either way
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Shared runners are too noisy to time anything, so the speed fixture is skipped.
      - run: uv run judge selftest --no-speed
      # Every hooked NumPy call, with and without hotkernels installed.
      - run: uv run delivery check

  # The judge on its second platform. No kernel is installed there yet, so
  # there is no delivery check to run.
  judge-linux:
    runs-on: ubuntu-latest # x86-64, with clang and GNU binutils installed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run judge selftest --no-speed
