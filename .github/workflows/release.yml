name: release

# Builds the hotkernels wheels and tests them. For a pushed v* tag it then
# publishes them to PyPI, once the maintainer approves, and creates the GitHub
# release. See docs/release-design.md.
#
# Who can publish. PyPI accepts uploads for hotkernels only from the `pypi`
# job below: trusted publishing, configured on pypi.org for this repository,
# this file and the `pypi` environment. That environment needs the
# maintainer's approval for every run and accepts only v* tags, and only the
# maintainer may push a v* tag (a repository ruleset). No PyPI token exists
# anywhere in the repository or its settings.
#
# Third-party actions are pinned to a commit, so a moved tag upstream cannot
# change what runs with publishing rights.

on:
  push:
    tags: ["v*"]
  # A change that could break a wheel builds and tests one before it merges.
  pull_request:
    paths:
      - "hotkernels/**"
      - "kernels/**"
      - "judge/build.py"
      - "judge/spec.py"
      - "release/**"
      - ".github/workflows/release.yml"
  # A rehearsal: build, test and upload to TestPyPI.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: macos-15 # Apple Silicon, where `uv run` builds the workspace
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `release verify` checks the tagged commit is on origin/main
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # For a tag: the tag names the version in meson.build, the commit is on
      # main, and the release notes are finished. Otherwise only reads the version.
      - id: verify
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run release verify --tag "$GITHUB_REF_NAME"
          else
            uv run release verify
          fi

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Settings are in [tool.cibuildwheel] in hotkernels/pyproject.toml.
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: hotkernels
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Every hooked NumPy call, with and without hotkernels, against each wheel
  # as built for release rather than the package built from the checkout.
  test:
    needs: build
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", tag: cp311 }
          - { python: "3.12", tag: cp312 }
          - { python: "3.13", tag: cp313 }
          - { python: "3.14", tag: cp314 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheelhouse
      - env:
          PYTHON: ${{ matrix.python }}
          WHEEL_TAG: ${{ matrix.tag }}
        run: |
          uv sync --python "$PYTHON"
          # Replace the package built from the checkout with the release wheel.
          uv pip install --reinstall wheelhouse/hotkernels-*-"$WHEEL_TAG"-"$WHEEL_TAG"-*.whl
          uv run --no-sync delivery check

  pypi:
    if: github.ref_type == 'tag'
    needs: [version, test]
    runs-on: ubuntu-latest
    # The gate: this job waits until the maintainer approves it, and PyPI
    # accepts an upload only from a job in this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/hotkernels/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write # trusted publishing: proves to PyPI which workflow and environment this is
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheelhouse
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheelhouse/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hotkernels/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheelhouse
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheelhouse/
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal of a version already rehearsed is not a failure.
          skip-existing: true

  github-release:
    needs: [version, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheelhouse
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" wheelhouse/*.whl --verify-tag \
            --title "hotkernels $VERSION" --notes-file "release-notes/$VERSION.md" "${flags[@]}"
