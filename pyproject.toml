[project]
name = "hotkernels-judge"
version = "0.1.0"
description = "Development judge for hotkernels: checks assembly kernels against NumPy and times them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.0",
    "typer>=0.29.1",
]

[project.scripts]
judge = "judge.cli:app"
survey = "survey.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judge", "survey"]
