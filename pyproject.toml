[project]
name = "hotkernels-judge"
version = "0.1.0"
description = "Development judge for hotkernels: checks assembly kernels against NumPy and times them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.scripts]
judge = "judge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judge"]
