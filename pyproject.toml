[project]
name = "hotkernels-judge"
version = "0.1.0"
description = "Development judge for hotkernels: checks assembly kernels against NumPy and times them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "hotkernels",
    "jinja2>=3.1.6",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "numpy>=2.0",
    "packaging>=24.0",
    "pygments>=2.17",
    "towncrier>=24.8",
    "typer>=0.29.1",
]

[project.scripts]
judge = "judge.cli:app"
survey = "survey.cli:app"
delivery = "delivery.cli:app"
release = "release.cli:app"
docsite = "docsite.cli:app"

[dependency-groups]
# What `uv run delivery numpy-tests` needs to run NumPy's own test suite.
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
]
# What `uv run --group workloads delivery workloads` needs: the libraries whose
# functions are timed as workloads. Pinned by uv.lock; updated by hand.
workloads = [
    "pandas>=3.0",
    "scikit-image>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judge", "survey", "delivery", "docsite"]

[tool.uv.workspace]
members = ["hotkernels"]

[tool.uv.sources]
hotkernels = { workspace = true, editable = false }

# Release notes: one note per pull request in release-notes/upcoming/, compiled
# into release-notes/<version>.md by `uv run release prepare`. The types below
# are also what `uv run release check-note` accepts; their order is the order
# of the sections in the notes. See docs/release-design.md.
[tool.towncrier]
name = "hotkernels"
directory = "release-notes/upcoming"
filename = "release-notes/{version}.md"
single_file = false
template = "release/templates/notes.md.j2"
# The template writes the title itself.
title_format = false
issue_format = "[#{issue}](https://github.com/sofeikov/hotkernels/pull/{issue})"
wrap = false

[[tool.towncrier.type]]
directory = "kernel"
name = "New kernels"
showcontent = true

[[tool.towncrier.type]]
directory = "speed"
name = "Faster"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "compat"
name = "Compatibility"
showcontent = true

[[tool.towncrier.type]]
directory = "change"
name = "Other changes"
showcontent = true
